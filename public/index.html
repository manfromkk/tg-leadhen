<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Заявка на встречу</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btnfg: var(--tg-theme-button-text-color, #fff);
    --field: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, Roboto, sans-serif; padding: 16px 16px 96px; }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; border: none; border-radius: 10px; background: var(--field);
    color: var(--fg); padding: 12px; font-size: 16px; outline: none;
  }
  textarea { resize: none; height: 68px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .req::after { content: ' *'; color: #e2574c; }
  #slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
  .slot {
    padding: 10px 0; border: none; border-radius: 9px; background: var(--field);
    color: var(--fg); font-size: 14px; text-align: center;
  }
  .slot:disabled { opacity: .32; text-decoration: line-through; }
  .slot.sel { background: var(--btn); color: var(--btnfg); font-weight: 600; }
  .slotmsg { color: var(--hint); font-size: 13px; margin-top: 6px; }
  #result { margin-top: 16px; padding: 12px; border-radius: 10px; background: var(--field); display: none; font-size: 14px; word-break: break-all; }
  #result a { color: var(--btn); }
  #sendbtn {
    position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 14px;
    border: none; border-radius: 12px; background: var(--btn); color: var(--btnfg);
    font-size: 16px; font-weight: 600;
  }
  #sendbtn:disabled { opacity: .55; }
</style>
</head>
<body>
  <h1>Заявка на встречу</h1>
  <div class="sub">Встреча появится в календаре Александра, клиенту уйдёт приглашение с Google Meet. Рабочее окно: 8:00–17:00.</div>

  <label class="req">Клиент (компания / имя)</label>
  <input id="client" placeholder="ТОО «Компания», Марат">

  <label>Email клиента</label>
  <input id="email" type="email" placeholder="client@company.kz — сюда уйдёт Meet">

  <div class="row">
    <div>
      <label class="req">Дата</label>
      <input id="date" type="date">
    </div>
    <div>
      <label>Длительность</label>
      <select id="dur">
        <option value="15">15 мин</option>
        <option value="30" selected>30 мин</option>
        <option value="45">45 мин</option>
        <option value="60">60 мин</option>
      </select>
    </div>
  </div>

  <label class="req">Время (свободные слоты)</label>
  <div id="slots"></div>
  <div class="slotmsg" id="slotmsg">Выбери дату — покажу свободные окна.</div>

  <div class="row">
    <div>
      <label>Источник</label>
      <select id="src">
        <option value="">—</option>
        <option>Коммеск</option>
        <option>Страховая</option>
        <option>Дата-хаб</option>
        <option>Другое</option>
      </select>
    </div>
    <div>
      <label>Продукт интереса</label>
      <select id="prod">
        <option value="">—</option>
        <option>VOC Platform</option>
        <option>NPS+</option>
        <option>Оба</option>
        <option>Уточнить</option>
      </select>
    </div>
  </div>

  <label>Тема / заметка</label>
  <textarea id="topic" placeholder="Одной строкой: что за клиент, какая боль"></textarea>

  <div id="result"></div>
  <button id="sendbtn">Создать встречу</button>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();

  var WORK_START = 8 * 60;   // 8:00
  var WORK_END   = 17 * 60;  // 17:00 — конец последней встречи
  var STEP = 30;             // шаг сетки, мин
  var TZ_OFFSET = '+05:00';  // Алматы

  var btn = document.getElementById('sendbtn');
  var box = document.getElementById('result');
  var slotsEl = document.getElementById('slots');
  var slotMsg = document.getElementById('slotmsg');
  var dateEl = document.getElementById('date');
  var durEl = document.getElementById('dur');

  var busy = [];        // [{startMs, endMs}]
  var selectedTime = ''; // 'HH:MM'

  // нельзя выбрать прошедшую дату
  (function () {
    var now = new Date(Date.now() + 5 * 3600 * 1000); // алматинское "сегодня"
    dateEl.min = now.toISOString().slice(0, 10);
  })();

  function v(id) { return document.getElementById(id).value.trim(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mmToHHMM(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }

  async function loadSlots() {
    selectedTime = '';
    slotsEl.innerHTML = '';
    var d = v('date');
    if (!d) { slotMsg.textContent = 'Выбери дату — покажу свободные окна.'; return; }
    slotMsg.textContent = 'Смотрю календарь…';
    try {
      var r = await fetch('/api/slots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, date: d })
      });
      var data = await r.json();
      if (!data.ok) { slotMsg.textContent = '⚠️ ' + (data.error || 'не получил календарь'); return; }
      busy = (data.busy || []).map(function (b) {
        return { s: new Date(b.start).getTime(), e: new Date(b.end).getTime() };
      });
      renderSlots();
    } catch (e) {
      slotMsg.textContent = '⚠️ Ошибка сети: ' + e.message;
    }
  }

  function renderSlots() {
    slotsEl.innerHTML = '';
    var d = v('date');
    if (!d) return;
    var dur = Number(v('dur')) || 30;
    var dayStart = new Date(d + 'T00:00:00' + TZ_OFFSET).getTime();
    var now = Date.now();
    var free = 0;

    for (var t = WORK_START; t + dur <= WORK_END; t += STEP) {
      var sMs = dayStart + t * 60000;
      var eMs = sMs + dur * 60000;
      var isBusy = busy.some(function (b) { return sMs < b.e && eMs > b.s; });
      var isPast = sMs < now;

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot';
      b.textContent = mmToHHMM(t);
      b.disabled = isBusy || isPast;
      if (!b.disabled) {
        free++;
        (function (timeStr, el) {
          el.addEventListener('click', function () {
            selectedTime = timeStr;
            var all = slotsEl.querySelectorAll('.slot');
            for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
            el.classList.add('sel');
            tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
          });
        })(mmToHHMM(t), b);
      }
      slotsEl.appendChild(b);
    }
    slotMsg.textContent = free
      ? 'Свободных окон: ' + free + '. Зачёркнутые — заняты или прошли.'
      : 'На эту дату свободных окон нет — выбери другой день.';
  }

  dateEl.addEventListener('change', loadSlots);
  durEl.addEventListener('change', renderSlots);

  btn.addEventListener('click', async function () {
    if (!v('client') || !v('date') || !selectedTime) {
      box.style.display = 'block';
      box.textContent = 'Заполни: клиент, дата и выбери свободный слот времени.';
      tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error');
      return;
    }
    btn.disabled = true; btn.textContent = 'Создаю…';
    box.style.display = 'none';

    try {
      var r = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: tg.initData,
          payload: {
            client: v('client'), email: v('email'),
            date: v('date'), time: selectedTime,
            dur: Number(v('dur')) || 30,
            src: v('src'), prod: v('prod'), topic: v('topic')
          }
        })
      });
      var data = await r.json();
      box.style.display = 'block';
      if (data.ok) {
        box.innerHTML = '✅ Встреча создана: ' + v('date') + ' в ' + selectedTime + '.' +
          (data.meet ? '<br>🎥 Meet: <a href="' + data.meet + '">' + data.meet + '</a>' : '') +
          '<br><br>Можно закрыть окно или создать ещё одну.';
        tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
        ['client','email','topic'].forEach(function(id){ document.getElementById(id).value=''; });
        loadSlots(); // обновить сетку — только что занятый слот станет недоступен
      } else {
        box.textContent = '⚠️ ' + (data.status || data.error || 'Не получилось, попробуй ещё раз.');
        tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error');
      }
    } catch (e) {
      box.style.display = 'block';
      box.textContent = '⚠️ Ошибка сети: ' + e.message;
    }
    btn.disabled = false; btn.textContent = 'Создать встречу';
  });
</script>
</body>
</html>
